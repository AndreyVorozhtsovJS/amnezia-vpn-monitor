poll_interval_seconds: 60
ssh_timeout_seconds: 8
# OFFLINE / VPN-container alerts after N failed checks in a row
alert_after_failures: 3
# CPU / RAM / disk alerts after N checks in a row above the threshold
resource_alert_after: 5
history_retention_days: 30
# Daily summary to TELEGRAM_CHAT_ID ("off" to disable)
daily_report_time: "09:00"
timezone: Europe/Moscow
# Traffic accounting: billing month starts on this day (1-28)
traffic_month_start_day: 1
# What a provider limit counts: total (in+out), out, or in
traffic_limit_counts: total
# Nightly encrypted Amnezia backups (needs BACKUP_PASSPHRASE in .env; "off" to disable)
backup_time: "04:00"
backup_keep_days: 14

thresholds:
  cpu_pct: 90
  memory_pct: 90
  disk_pct: 90
  packet_loss_pct: 10
  ping_ms: 200

# Start with one server. Duplicate this block when vpn-01 is working.
servers:
  - name: vpn-01
    employee: Employee 1
    host: 203.0.113.11
    port: 22
    user: vpnmon
    key_path: /opt/amnezia-vpn-monitor/keys/vpnmon_ed25519
    # Optional provider traffic limit per billing month (alerts at 80% and 95%)
    # traffic_limit_gb: 1000
    # Optional: VPS paid until (can also be set from Telegram: /paid vpn-01 2026-11-15)
    # paid_until: 2026-10-15
